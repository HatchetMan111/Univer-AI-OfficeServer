# Univer static SPA – nginx-Konfiguration (von univer.service verwaltet).
# Passe PORT und den root-Pfad an deine Installation an.
worker_processes 1;
pid /run/univer-nginx.pid;
error_log /var/log/univer/nginx-error.log;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/univer/nginx-access.log;
    server {
        listen 8099;
        listen [::]:8099;
        server_name _;
        root /opt/univer/dist;
        index index.html;
        # SPA-Fallback: unbekannte Pfade an die App übergeben.
        location / { try_files $uri $uri/ /index.html; }
    }
}